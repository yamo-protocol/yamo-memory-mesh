name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Committed JS is in sync with TS source
        run: |
          git diff --exit-code -- lib || {
            echo "::error::Committed lib/*.js is stale — run 'npm run build' and commit the output."
            exit 1
          }

      - name: Run unit tests
        run: npx tsx --test test/unit/*.test.ts

      - name: Run e2e tests
        run: npx tsx --test test/e2e/*.test.ts
